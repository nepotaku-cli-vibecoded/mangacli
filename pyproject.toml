[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "man-cli"
version = "0.3.0"
description = "Multi-source terminal manga reader"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
    "cloudscraper>=1.2.71",
]

[project.scripts]
man-cli = "mangacli.main:main"

[tool.setuptools.packages.find]
include = ["mangacli*"]
